# cypod-telemetry

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    container_name: cypod-telemetry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: ./backend
    container_name: cypod-telemetry-api
    restart: unless-stopped
    environment:
      PORT: 3000
      # Postgres
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Telemetry
      TELEMETRY_BACKFILL_THRESHOLD: ${TELEMETRY_BACKFILL_THRESHOLD}
      LIVE_LIMIT: ${LIVE_LIMIT}
      BACKFILL_LIMIT: ${BACKFILL_LIMIT}
      WINDOWS_MS: ${WINDOWS_MS}
      BATTERY_ALERT_THRESHOLD: ${BATTERY_ALERT_THRESHOLD}
      TEMPERATURE_ALERT_THRESHOLD: ${TEMPERATURE_ALERT_THRESHOLD}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: